name: Generate Keystore (Run Once)

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate keystore
        run: |
          keytool -genkeypair -v \
            -keystore release.keystore \
            -alias engteck \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "EngTeck@2026Secure" \
            -keypass "EngTeck@2026Secure" \
            -dname "CN=Shivani, OU=Shreeyog, O=Shreeyog Website and App Designer, L=Pithoragarh, ST=Uttarakhand, C=IN"

      - name: Show SHA256 fingerprint (copy this!)
        run: keytool -list -v -keystore release.keystore -alias engteck -storepass "EngTeck@2026Secure"

      - name: Base64 encode keystore
        run: base64 -w 0 release.keystore > release.keystore.base64.txt

      - name: Upload keystore artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-keystore
          path: |
            release.keystore
            release.keystore.base64.txt
